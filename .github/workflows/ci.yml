name: CI

on:
  push:
    branches:
      - modern-base
      - 'architecture/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          verify-signature: true

      - name: Verify
        run: ./mvnw -B verify

      - name: Build container image
        run: docker build -t authentication-service:${{ github.sha }} .
