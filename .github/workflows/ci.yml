name: CI

on:
  push:
    branches:
      - modern-base
      - 'architecture/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          verify-signature: true

      - name: Verify
        run: ./mvnw -B verify

      - name: Build container image
        run: docker build -t authentication-service:${{ github.sha }} .
