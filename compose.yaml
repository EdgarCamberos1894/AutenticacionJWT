services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

volumes:
  auth-postgres-data:
