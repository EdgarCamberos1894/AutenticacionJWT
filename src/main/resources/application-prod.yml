spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
  jpa:
    show-sql: false

security:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    keys:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION}

auth:
  email:
    product-name: ${AUTH_EMAIL_PRODUCT_NAME:Authentication}
    resend:
      api-key: ${RESEND_API_KEY}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
      from-name: ${RESEND_FROM_NAME:Authentication}
      from-address: ${RESEND_FROM_ADDRESS}
      reply-to: ${RESEND_REPLY_TO:}
      connect-timeout: ${RESEND_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${RESEND_READ_TIMEOUT:PT5S}
  email-verification:
    public-url: ${VERIFICATION_PUBLIC_URL}
  password-reset:
    public-url: ${PASSWORD_RESET_PUBLIC_URL}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
