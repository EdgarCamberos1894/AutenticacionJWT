spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

security:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    keys:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
      previous-public-key-locations: ${JWT_PREVIOUS_PUBLIC_KEY_LOCATIONS:}

auth:
  email:
    product-name: ${AUTH_EMAIL_PRODUCT_NAME:Authentication}
    resend:
      api-key: ${RESEND_API_KEY}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
      from-name: ${RESEND_FROM_NAME:Authentication}
      from-address: ${RESEND_FROM_ADDRESS}
      reply-to: ${RESEND_REPLY_TO:}
      connect-timeout: ${RESEND_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${RESEND_READ_TIMEOUT:PT5S}
      webhook:
        signing-secret: ${RESEND_WEBHOOK_SIGNING_SECRET}
        tolerance: ${RESEND_WEBHOOK_TOLERANCE:PT5M}
    outbox:
      worker-enabled: ${EMAIL_OUTBOX_WORKER_ENABLED:true}
      active-key-id: ${EMAIL_OUTBOX_ACTIVE_KEY_ID}
      active-key: ${EMAIL_OUTBOX_ACTIVE_KEY}
      previous-key-id: ${EMAIL_OUTBOX_PREVIOUS_KEY_ID:}
      previous-key: ${EMAIL_OUTBOX_PREVIOUS_KEY:}
      poll-interval: ${EMAIL_OUTBOX_POLL_INTERVAL:PT2S}
      lease-duration: ${EMAIL_OUTBOX_LEASE_DURATION:PT30S}
      base-backoff: ${EMAIL_OUTBOX_BASE_BACKOFF:PT5S}
      max-backoff: ${EMAIL_OUTBOX_MAX_BACKOFF:PT5M}
      batch-size: ${EMAIL_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${EMAIL_OUTBOX_MAX_ATTEMPTS:8}
  email-verification:
    public-url: ${VERIFICATION_PUBLIC_URL}
  password-reset:
    public-url: ${PASSWORD_RESET_PUBLIC_URL}

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    org.springframework.security: INFO
    security.audit: INFO
