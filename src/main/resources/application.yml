spring:
  application:
    name: authentication-service
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

security:
  jwt:
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT10M}
  sessions:
    session-ttl: ${AUTH_SESSION_TTL:P30D}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P7D}
  one-time-tokens:
    email-verification-ttl: ${EMAIL_VERIFICATION_TTL:PT30M}
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT15M}
  client-ip:
    trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    register:
      limit: ${RATE_LIMIT_REGISTER_LIMIT:5}
      window: ${RATE_LIMIT_REGISTER_WINDOW:PT10M}
    login:
      limit: ${RATE_LIMIT_LOGIN_LIMIT:10}
      window: ${RATE_LIMIT_LOGIN_WINDOW:PT1M}
    login-account:
      limit: ${RATE_LIMIT_LOGIN_ACCOUNT_LIMIT:10}
      window: ${RATE_LIMIT_LOGIN_ACCOUNT_WINDOW:PT5M}
    refresh:
      limit: ${RATE_LIMIT_REFRESH_LIMIT:60}
      window: ${RATE_LIMIT_REFRESH_WINDOW:PT1M}
    email-verification:
      limit: ${RATE_LIMIT_VERIFY_LIMIT:5}
      window: ${RATE_LIMIT_VERIFY_WINDOW:PT15M}
    email-verification-confirm:
      limit: ${RATE_LIMIT_VERIFY_CONFIRM_LIMIT:20}
      window: ${RATE_LIMIT_VERIFY_CONFIRM_WINDOW:PT5M}
    password-reset:
      limit: ${RATE_LIMIT_RESET_LIMIT:5}
      window: ${RATE_LIMIT_RESET_WINDOW:PT15M}
    password-reset-confirm:
      limit: ${RATE_LIMIT_RESET_CONFIRM_LIMIT:10}
      window: ${RATE_LIMIT_RESET_CONFIRM_WINDOW:PT5M}

auth:
  email:
    product-name: ${AUTH_EMAIL_PRODUCT_NAME:Authentication}
    resend:
      api-key: ${RESEND_API_KEY:local-not-used}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
      from-name: ${RESEND_FROM_NAME:Authentication}
      from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}
      reply-to: ${RESEND_REPLY_TO:}
      connect-timeout: ${RESEND_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${RESEND_READ_TIMEOUT:PT5S}
      webhook:
        signing-secret: ${RESEND_WEBHOOK_SIGNING_SECRET:whsec_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
        tolerance: ${RESEND_WEBHOOK_TOLERANCE:PT5M}
    outbox:
      worker-enabled: ${EMAIL_OUTBOX_WORKER_ENABLED:true}
      active-key-id: ${EMAIL_OUTBOX_ACTIVE_KEY_ID:local-v1}
      active-key: ${EMAIL_OUTBOX_ACTIVE_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      previous-key-id: ${EMAIL_OUTBOX_PREVIOUS_KEY_ID:}
      previous-key: ${EMAIL_OUTBOX_PREVIOUS_KEY:}
      poll-interval: ${EMAIL_OUTBOX_POLL_INTERVAL:PT2S}
      lease-duration: ${EMAIL_OUTBOX_LEASE_DURATION:PT30S}
      base-backoff: ${EMAIL_OUTBOX_BASE_BACKOFF:PT5S}
      max-backoff: ${EMAIL_OUTBOX_MAX_BACKOFF:PT5M}
      batch-size: ${EMAIL_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${EMAIL_OUTBOX_MAX_ATTEMPTS:8}
  email-verification:
    public-url: ${VERIFICATION_PUBLIC_URL:http://localhost:3000/verify-email}
  password-reset:
    public-url: ${PASSWORD_RESET_PUBLIC_URL:http://localhost:3000/reset-password}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
