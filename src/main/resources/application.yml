spring:
  application:
    name: authentication-service
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

security:
  jwt:
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT10M}
  sessions:
    session-ttl: ${AUTH_SESSION_TTL:P30D}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P7D}
  one-time-tokens:
    email-verification-ttl: ${EMAIL_VERIFICATION_TTL:PT30M}
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT15M}

auth:
  email-verification:
    public-url: ${VERIFICATION_PUBLIC_URL:http://localhost:3000/verify-email}
    from: ${MAIL_FROM:no-reply@example.local}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
