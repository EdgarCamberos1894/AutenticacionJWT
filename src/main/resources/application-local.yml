spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:auth}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jpa:
    show-sql: false

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:authentication-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org.springframework.security: INFO
